services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.2.1
    container_name: fraud_redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - "9092:9092"
      - "9644:9644"

  api:
    build: .
    container_name: fraud_api
    command: uvicorn consumer_api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    env_file:
      - .env
    depends_on:
      - redpanda

  producer:
    build: .
    container_name: fraud_producer
    command: python producer.py
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    depends_on:
      - redpanda

  dashboard:
    build: .
    container_name: fraud_dashboard
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api