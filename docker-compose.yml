services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinel-fraud-engine:local
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEMO_MODE: ${DEMO_MODE:-true}
      INGEST_MODE: ${INGEST_MODE:-simulator}
      INGEST_FALLBACK: ${INGEST_FALLBACK:-simulator}
      SIMULATOR_TPS: ${SIMULATOR_TPS:-0.2}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/sentinel.db}
      MODEL_DIR: /app/artifacts
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-redpanda:29092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-transaksi-finansial}
      KAFKA_GROUP: ${KAFKA_GROUP:-sentinel-scoring-v1}
      SENTINEL_API_KEY: ${SENTINEL_API_KEY:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      CHAT_ID: ${CHAT_ID:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - sentinel-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Optional Kafka-compatible broker for the producer demo:
  #   docker compose --profile kafka up -d
  # Then set INGEST_MODE=kafka and KAFKA_BOOTSTRAP_SERVERS=redpanda:29092.
  redpanda:
    image: redpandadata/redpanda:latest
    profiles: ["kafka"]
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:29092,OUTSIDE://127.0.0.1:9092
    ports:
      - "9092:9092"
      - "9644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

volumes:
  sentinel-data:
  redpanda-data:

