services:
  - type: web
    name: sentinel-fraud-ops
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: INGEST_MODE
        value: simulator
      - key: SIMULATOR_TPS
        value: "0.2"
      - key: SEED_DEMO_DATA
        value: "true"
      # Render Free has 512 MB RAM. The full 92k-row baseline is too close to
      # that ceiling, so the hosted demo uses a lighter seven-day baseline.
      - key: SEED_HISTORY_ROWS
        value: "20000"
      - key: SEED_HISTORY_DAYS
        value: "7"
      - key: RETENTION_DAYS
        value: "7"
      - key: PUBLIC_BASE_URL
        value: https://sentinel-fraud-ops.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"
