name: Verify, publish, and deploy

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: production-delivery
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  deployments: write

env:
  IMAGE_NAME: ghcr.io/andikaputh/fraud-detection-engine
  PUBLIC_URL: https://sentinel-fraud-ops.onrender.com

jobs:
  verify:
    name: Verify backend and console
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install console dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Build console
        working-directory: frontend
        run: npm run build

  publish:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=Sentinel Fraud Engine
            org.opencontainers.image.description=Real-time fraud decisioning engine with a live operations console.
            org.opencontainers.image.source=https://github.com/Andikaputh/fraud-detection-engine
            org.opencontainers.image.url=https://sentinel-fraud-ops.onrender.com/
            org.opencontainers.image.licenses=MIT

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write package summary
        run: |
          {
            echo "### Container image"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Verify Render deployment
    needs: publish
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check Render availability
        id: render
        run: |
          status=""
          for attempt in 1 2 3; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$PUBLIC_URL/api/v1/health" || true)
            if [ "$status" = "200" ]; then
              break
            fi
            echo "Render health attempt $attempt returned $status."
            sleep 5
          done
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Render is not reachable at $PUBLIC_URL yet. Create the Blueprint first, then re-run this workflow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for Render to serve this commit
        if: steps.render.outputs.enabled == 'true'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 90); do
            body=$(curl -fsS --max-time 30 "$PUBLIC_URL/api/v1/health" || true)
            read -r health_status commit <<< "$(printf '%s' "$body" | python -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""), d.get("commit") or "")' 2>/dev/null || true)"
            if [ "$health_status" = "ok" ] && [ "$commit" = "$EXPECTED_SHA" ]; then
              echo "Render is healthy and serving commit $commit."
              exit 0
            fi
            echo "Waiting for Render (attempt $attempt, status ${health_status:-unknown}, live commit ${commit:-unknown})."
            sleep 10
          done
          echo "::error::Render did not serve the expected commit within 15 minutes."
          exit 1

      - name: Record GitHub deployment
        if: steps.render.outputs.enabled == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Render production deployment',
            });

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: 'https://sentinel-fraud-ops.onrender.com/',
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Deployed to Render',
            });
